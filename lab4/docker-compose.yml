services:
  postgres:
    build:
      context: .
      dockerfile: postgres/Dockerfile
    image: bdsnowflake-lab4-postgres:local
    container_name: bdsnowflake_lab4_postgres
    environment:
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: lab
      POSTGRES_DB: snowflake_lab
    ports:
      - "5432:5432"
    volumes:
      - lab4_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab -d snowflake_lab"]
      interval: 5s
      timeout: 3s
      retries: 20

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: bdsnowflake_lab4_clickhouse
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: lab
      CLICKHOUSE_PASSWORD: lab
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "8123:8123"
      - "9000:9000"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - lab4_clickhouse_data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  loader:
    build:
      context: .
      dockerfile: loader/Dockerfile
    image: bdsnowflake-lab4-loader:local
    container_name: bdsnowflake_lab4_loader
    environment:
      PGHOST: postgres
      PGUSER: lab
      PGPASSWORD: lab
      PGDATABASE: snowflake_lab
      CH_HOST: clickhouse
      CH_USER: lab
      CH_PASSWORD: lab
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    restart: "no"

  trino:
    build:
      context: .
      dockerfile: trino/Dockerfile
    image: bdsnowflake-lab4-trino:local
    container_name: bdsnowflake_lab4_trino
    ports:
      - "8080:8080"
    depends_on:
      loader:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/v1/info"]
      interval: 5s
      timeout: 3s
      retries: 40

volumes:
  lab4_postgres_data:
  lab4_clickhouse_data:
